databaseChangeLog:
  - changeSet:
      id: 03
      author: sour-soup
      comment: "Create bids table for task applications"
      changes:
        - createTable:
            tableName: bids
            remarks: "Bids from executors to tasks"
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, remarks: "PK" }
              - column: { name: task_id, type: BIGINT, remarks: "Target task" }
              - column: { name: executor_id, type: BIGINT, remarks: "Executor who placed bid" }
              - column: { name: status, type: VARCHAR(32), remarks: "PENDING, ACCEPTED, REJECTED" }
              - column: { name: created_at, type: TIMESTAMP, remarks: "Creation time" }
              - column: { name: updated_at, type: TIMESTAMP, remarks: "Last update time" }
        - addPrimaryKey:
            tableName: bids
            columnNames: id
            constraintName: pk_bids
        - addUniqueConstraint:
            tableName: bids
            columnNames: task_id, executor_id
            constraintName: uk_bids_task_executor
        - createIndex:
            tableName: bids
            indexName: idx_bids_task
            columns:
              - column: { name: task_id }
        - createIndex:
            tableName: bids
            indexName: idx_bids_executor
            columns:
              - column: { name: executor_id }
