databaseChangeLog:
  - changeSet:
      id: 04
      author: sour-soup
      comment: "Create payments table for holds and transfers"
      changes:
        - createTable:
            tableName: payments
            remarks: "Payment holds and transfers between users"
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, remarks: "PK" }
              - column: { name: task_id, type: BIGINT, remarks: "Related task" }
              - column: { name: sender_id, type: BIGINT, remarks: "Payer (customer)" }
              - column: { name: receiver_id, type: BIGINT, remarks: "Payee (executor)" }
              - column: { name: amount, type: BIGINT, remarks: "Amount in soups" }
              - column: { name: type, type: VARCHAR(32), remarks: "HOLD, RELEASE, PAYMENT" }
              - column: { name: created_at, type: TIMESTAMP, remarks: "Creation time" }
              - column: { name: updated_at, type: TIMESTAMP, remarks: "Last update time" }
        - addPrimaryKey:
            tableName: payments
            columnNames: id
            constraintName: pk_payments
        - sql:
            splitStatements: false
            sql: ALTER TABLE payments ADD CONSTRAINT ck_payments_amount CHECK (amount > 0);
        - createIndex:
            tableName: payments
            indexName: idx_payments_task_id
            columns:
              - column: { name: task_id }
        - createIndex:
            tableName: payments
            indexName: idx_payments_sender_id
            columns:
              - column: { name: sender_id }
        - createIndex:
            tableName: payments
            indexName: idx_payments_receiver_id
            columns:
              - column: { name: receiver_id }
