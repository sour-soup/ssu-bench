databaseChangeLog:
  - changeSet:
      id: 02
      author: sour-soup
      comment: "Create tasks table with lifecycle statuses"
      changes:
        - createTable:
            tableName: tasks
            remarks: "Tasks created by customers"
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, remarks: "PK" }
              - column: { name: title, type: VARCHAR(255), remarks: "Task title" }
              - column: { name: description, type: TEXT, remarks: "Task description" }
              - column: { name: reward, type: BIGINT, remarks: "Reward in soups, minimum 1" }
              - column: { name: status, type: VARCHAR(32), remarks: "PUBLISHED, IN_PROGRESS, COMPLETED, CANCELLED" }
              - column: { name: customer_id, type: BIGINT, remarks: "Creator (customer)" }
              - column: { name: executor_id, type: BIGINT, remarks: "Executor who won the bid, nullable" }
              - column: { name: created_at, type: TIMESTAMP, remarks: "Creation time" }
              - column: { name: updated_at, type: TIMESTAMP, remarks: "Last update time" }
        - addPrimaryKey:
            tableName: tasks
            columnNames: id
            constraintName: pk_tasks
        - createIndex:
            tableName: tasks
            indexName: idx_tasks_customer
            columns:
              - column: { name: customer_id }
        - createIndex:
            tableName: tasks
            indexName: idx_tasks_selected_executor
            columns:
              - column: { name: executor_id }
